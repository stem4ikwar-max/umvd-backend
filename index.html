<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>УМВД — Электронный Документооборот</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <div id="dots-bg"></div>

  <!-- Экран входа -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Вход</div>
        <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Регистрация</div>
      </div>
      <h1 id="auth-title" style="font-size:1.2rem; margin-bottom:14px;">Вход в систему</h1>
      <input type="text" id="auth-username" placeholder="Логин">
      <input type="password" id="auth-password" placeholder="Пароль">
      <button class="btn-main" id="auth-submit-btn" onclick="submitAuth()">Войти</button>
    </div>
  </div>

  <!-- Главное пространство -->
  <div id="board-viewport">
    <div class="top-bar">
      <div id="leader-tools" style="display:none; gap:8px;">
        <button class="btn-tool" onclick="openLeaderModal()">👑 Панель Лидеров</button>
        <button class="btn-tool" id="btn-top-admin" style="display:none; color:#f6ad55;" onclick="openAdminModal()">⚙️ Админ-панель</button>
        <button class="btn-tool" onclick="openCreateModal('folder')">+ Отдел</button>
        <button class="btn-tool" onclick="openCreateModal('doc')">+ Документ</button>
      </div>
      <button class="btn-tool" onclick="resetZoom()">🎯 Сброс зума</button>
    </div>

    <!-- Профиль -->
    <div class="profile-container">
      <div class="avatar-btn" id="avatar-btn" onclick="toggleProfileMenu()">U</div>
      <div class="profile-dropdown" id="profile-dropdown">
        <div style="border-bottom:1px solid #282d37; padding-bottom:8px; margin-bottom:10px;">
          <div style="font-weight:700; color:#fff;" id="prof-name">Пользователь</div>
          <div style="font-size:0.75rem; color:#60a5fa;" id="prof-role">Пользователь</div>
          <div style="font-size:0.75rem; color:#9ca3af; margin-top:2px;" id="prof-uid">UID: -</div>
        </div>
        <button class="btn-tool" style="width:100%; color:#f87171;" onclick="logout()">Выйти</button>
      </div>
    </div>

    <div id="board-container">
      <svg id="connections-svg"></svg>
    </div>
  </div>

  <!-- Редактор документа (Блочный как на фото 3) -->
  <div id="editor-modal">
    <div class="editor-header">
      <span style="color:#60a5fa; font-weight:600;">Редактирование Документа</span>
      <div style="display:flex; gap:10px;">
        <button class="btn-main" onclick="downloadPNG()">🖼️ Скачать PNG</button>
        <button class="btn-outline" style="color:#f87171;" onclick="closeEditor()">✕ Закрыть</button>
      </div>
    </div>
    <div class="editor-body">
      <!-- Левая часть (Блоки параметров) -->
      <div class="editor-left">
        
        <!-- Красивая кнопка загрузки файла (Замена дефолтной) -->
        <div id="leader-img-upload" style="display:none; margin-bottom:16px;">
          <label style="font-size:0.8rem; color:#9ca3af; font-weight:600; display:block; margin-bottom:6px;">Печать / Фото на бланк</label>
          <label class="custom-file-upload">
            <input type="file" accept="image/*" onchange="uploadImageFromFile(event)">
            📁 Выбрать изображение
          </label>
        </div>

        <div class="form-group">
          <label>Код документа</label>
          <input type="text" id="inp-code" class="form-control" placeholder="LSPD-MIS-SD-001" oninput="renderPaper()">
        </div>

        <!-- Контейнер динамических секций -->
        <div id="sections-container"></div>

        <!-- Кнопки добавления новых секций -->
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; margin-bottom:15px;">
          <button class="btn-tool" onclick="addSectionBlock('Без заголовка', '')">+ Текст</button>
          <button class="btn-tool" onclick="addSectionBlock('Установил', '')">+ Установил</button>
          <button class="btn-tool" onclick="addSectionBlock('Постановил', '')">+ Постановил</button>
          <button class="btn-tool" onclick="addSectionBlock('Решил', '')">+ Решил</button>
          <button class="btn-tool" onclick="addSectionBlock('Определил', '')">+ Определил</button>
        </div>

        <div class="form-group">
          <label>ФИО Составителя</label>
          <input type="text" id="inp-author" class="form-control" placeholder="Павел Аграбейко" oninput="renderPaper()">
        </div>
        <div class="form-group">
          <label>Должность</label>
          <input type="text" id="inp-role" class="form-control" placeholder="Начальник УМВД" oninput="renderPaper()">
        </div>

        <button class="btn-main" id="btn-save-doc" style="margin-top:10px; display:none;" onclick="saveCurrentDoc()">💾 Сохранить изменения</button>
      </div>

      <!-- Правая часть (Предпросмотр бланка) -->
      <div class="editor-right">
        <div class="paper-doc" id="paper-doc">
          <div style="text-align: center; font-size: 10pt; font-weight: bold; text-transform: uppercase;">
            LOS SANTOS POLICE DEPARTMENT<br>
            <small id="p-code" style="font-weight: normal; font-size: 8pt; color:#555;">LSPD-MIS-SD-001</small>
          </div>

          <div class="doc-line" style="height:1px; background:#000; margin:12px 0;"></div>

          <div id="paper-sections-render" style="font-size: 10pt; line-height: 1.5;"></div>

          <div style="margin-top: 40px; display: flex; justify-content: space-between; align-items: flex-end; font-size: 9pt;">
            <div>
              <strong id="p-role">Начальник УМВД</strong><br>
              <span id="p-author" style="font-size:10pt; font-weight:bold;">П. Аграбейко</span>
            </div>
            <div>
              <span id="p-date">14.09.2026</span>
            </div>
          </div>

          <div id="images-container"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Модалки -->
  <div class="modal-overlay" id="leader-modal">
    <div class="modal-box" style="max-width: 500px;">
      <h3 style="margin-bottom:10px;">👑 Панель Лидеров</h3>
      <div style="max-height: 250px; overflow-y: auto;">
        <table style="width:100%; border-collapse:collapse; font-size:0.85rem; color:#fff;">
          <tbody id="leader-docs-list"></tbody>
        </table>
      </div>
      <div style="margin-top:14px; text-align:right;">
        <button class="btn-outline" onclick="document.getElementById('leader-modal').style.display='none'">Закрыть</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="admin-modal">
    <div class="modal-box" style="max-width: 550px;">
      <h3 style="margin-bottom:12px;">⚙️ Панель Администратора</h3>
      <div style="max-height: 300px; overflow-y: auto;">
        <table style="width:100%; border-collapse:collapse; font-size:0.85rem; color:#fff;">
          <thead>
            <tr style="text-align:left; border-bottom:1px solid #282d37;">
              <th style="padding:6px;">UID</th>
              <th style="padding:6px;">Логин</th>
              <th style="padding:6px;">Роль</th>
              <th style="padding:6px;">Лидер</th>
              <th style="padding:6px;">Действие</th>
            </tr>
          </thead>
          <tbody id="admin-users-list"></tbody>
        </table>
      </div>
      <div style="margin-top:14px; text-align:right;">
        <button class="btn-outline" onclick="document.getElementById('admin-modal').style.display='none'">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
